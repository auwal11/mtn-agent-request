{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>Ƙara Sabon Agent</h2>
  <form method="post" enctype="multipart/form-data" id="agentForm">

    <h3>Bayanan Sirri</h3>
    <div class="grid2">
      <div><label>Surname</label><input name="surname" required></div>
      <div><label>First Name</label><input name="first_name" required></div>
    </div>
    <div class="grid2">
      <div><label>Other Name</label><input name="other_name"></div>
      <div><label>Gender</label>
        <select name="gender"><option>MALE</option><option>FEMALE</option></select>
      </div>
    </div>
    <div class="grid2">
      <div><label>NIN</label><input name="nin" required maxlength="11"></div>
      <div><label>Qualification</label><input name="qualification" value="SSCE"></div>
    </div>
    <div class="grid2">
      <div><label>Phone Number</label><input name="phone_number" required></div>
      <div><label>MoMo Number</label><input name="momo_number"></div>
    </div>
    <div class="grid2">
      <div><label>Email</label><input name="email" type="email"></div>
      <div><label>KYC Username</label><input name="kyc_username"></div>
    </div>

    <h3>Bayanan Outlet</h3>
    <div class="grid2">
      <div><label>Outlet/Store Name</label><input name="outlet_name" required></div>
      <div><label>Outlet Type</label><input name="outlet_type" value="CCR OUTLET"></div>
    </div>
    <label>Outlet Address</label>
    <input name="outlet_address" required>
    <div class="grid2">
      <div><label>LGA</label><input name="lga" value="{{ partner['lga'] }}"></div>
      <div><label>Territory</label><input name="territory"></div>
    </div>
    <div class="grid2">
      <div><label>Cluster</label><input name="cluster"></div>
      <div><label>State</label><input name="state" value="{{ partner['state'] }}"></div>
    </div>
    <div class="grid2">
      <div><label>Latitude</label><input name="latitude"></div>
      <div><label>Longitude</label><input name="longitude"></div>
    </div>

    <h3>Device</h3>
    <div class="grid2">
      <div><label>Device Tag ID</label><input name="device_tag_id" required placeholder="MTN0299169"></div>
      <div><label>Device IMEI</label><input name="device_imei"></div>
    </div>

    <h3>Hoto (Passport)</h3>
    <input type="file" name="photo" accept="image/*" required>

    <h3>Sa Hannu (Signature)</h3>
    <p style="font-size:13px;color:#666;">Rubuta sa hannu a nan da yatsa/linzami. Ana amfani da wannan a Form 3 (Authorization for Deduction) da Form 5 (Attestation).</p>
    <canvas id="sigPad" width="500" height="150" style="border:1px solid #ccc; border-radius:6px; touch-action:none;"></canvas><br>
    <button type="button" class="btn secondary" onclick="clearSig()">Share Sa Hannu</button>
    <input type="hidden" name="signature_data" id="signature_data">

    <br><br>
    <button class="btn" type="submit" name="action" value="save">Ajiye & Koma Dashboard</button>
    <button class="btn secondary" type="submit" name="action" value="add_another">Ajiye & Ƙara Wani</button>
  </form>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/signature_pad/4.1.7/signature_pad.umd.min.js"></script>
<script>
  const canvas = document.getElementById('sigPad');
  const signaturePad = new SignaturePad(canvas, {backgroundColor: 'rgb(255,255,255)'});

  function clearSig() { signaturePad.clear(); }

  document.getElementById('agentForm').addEventListener('submit', function(e) {
    if (!signaturePad.isEmpty()) {
      document.getElementById('signature_data').value = signaturePad.toDataURL('image/png');
    }
  });
</script>
{% endblock %}
