<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}MTN Agent Onboarding{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14161A; --panel:#FFFFFF; --page:#F3F4F6; --border:#E6E7EB; --muted:#6B7280;
    --yellow:#FFCC00; --yellow-deep:#E6B800; --green:#1D9A6C; --green-bg:#E8F7F0;
    --red:#D64545; --red-bg:#FCEBEB; --blue:#2F6FED; --blue-bg:#EAF1FE; --radius:14px;
    --font-display:'Poppins',sans-serif; --font-body:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font-body);color:var(--ink);font-size:14.5px;line-height:1.5;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 16px;
    background:radial-gradient(1000px 500px at 15% -10%, #FFF7DC 0%, transparent 60%),
               radial-gradient(900px 500px at 100% 100%, #EAF1FE 0%, transparent 55%), var(--page);}
  .wrap{width:100%;max-width:460px;}
  .logo-row{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:22px;}
  .logo-row .mark{width:38px;height:38px;border-radius:11px;background:#20242B;color:var(--yellow);
    display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:18px;}
  .logo-row .txt{font-family:var(--font-display);font-weight:700;font-size:15px;}
  .logo-row .txt small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:28px 26px;box-shadow:0 10px 40px -18px rgba(20,22,26,.25);}
  .card h1{font-family:var(--font-display);font-size:20px;margin:0 0 6px;font-weight:800;}
  .card .desc{color:var(--muted);font-size:13px;margin:0 0 20px;}
  form label{display:block;font-size:12.5px;font-weight:600;margin:14px 0 5px;color:#3A3D44;}
  form label:first-child{margin-top:0;}
  input,select,textarea{width:100%;padding:11px 13px;border-radius:9px;border:1px solid var(--border);
    box-sizing:border-box;font-size:14px;font-family:var(--font-body);background:#fff;color:var(--ink);}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--yellow);outline-offset:0;border-color:var(--yellow-deep);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--yellow);color:#1a1a1a;
    padding:12px 18px;border-radius:10px;text-decoration:none;border:none;font-weight:700;
    cursor:pointer;font-size:14px;font-family:var(--font-body);width:100%;margin-top:18px;transition:background .15s;}
  .btn:hover{background:var(--yellow-deep);}
  .btn.secondary{background:#fff;border:1px solid var(--border);color:var(--ink);margin-top:10px;}
  .btn.secondary:hover{background:#F5F5F6;}
  .flash{padding:12px 16px;border-radius:9px;margin-bottom:16px;font-size:13.5px;font-weight:500;}
  .flash.success{background:var(--green-bg);color:var(--green);}
  .flash.error{background:var(--red-bg);color:var(--red);}
  .flash.info{background:var(--blue-bg);color:var(--blue);}
  .footer-link{text-align:center;margin-top:18px;font-size:12.5px;color:var(--muted);}
  .footer-link a{color:var(--muted);text-decoration:underline;}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;
    text-transform:uppercase;letter-spacing:.02em;}
  .badge.submitted{background:var(--blue-bg);color:var(--blue);}
  .badge.in_review{background:#FFF6DA;color:#8A6A00;}
  .badge.confirmed{background:var(--green-bg);color:var(--green);}
  .agent-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);}
  .agent-row:last-child{border-bottom:none;}
  .agent-row .nm{font-weight:600;font-size:13.5px;}
  .agent-row .sub{font-size:12px;color:var(--muted);}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo-row">
    <div class="mark">M</div>
    <div class="txt">MTN Agent Onboarding<small>Powered by RACU Dashboard</small></div>
  </div>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
