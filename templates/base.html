<!doctype html>
<html lang="ha">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}RACU MTN Agent Dashboard{% endblock %}</title>
<style>
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f5f7; margin: 0; color: #222; }
  header { background: #FFCC00; padding: 16px 24px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size: 20px; margin: 0; color:#1a1a1a; }
  .container { max-width: 960px; margin: 24px auto; padding: 0 16px; }
  .card { background: white; border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eee; font-size: 14px; }
  th { background: #fafafa; }
  .btn { display: inline-block; background: #FFCC00; color: #1a1a1a; padding: 10px 18px; border-radius: 6px;
         text-decoration: none; border: none; font-weight: 600; cursor: pointer; font-size: 14px; }
  .btn.secondary { background: #eee; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .flash { padding: 10px 14px; border-radius: 6px; margin-bottom: 12px; font-size: 14px; }
  .flash.success { background: #e6f7e6; color: #1a7a1a; }
  .flash.error { background: #fde8e8; color: #a71d1d; }
  .flash.info { background: #e8f0fe; color: #1a4c9c; }
  label { display:block; font-size: 13px; font-weight: 600; margin: 10px 0 4px; }
  input, select { width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  .badge { display:inline-block; padding: 3px 10px; border-radius: 12px; font-size:12px; font-weight:600; }
  .badge.draft { background:#fff3cd; color:#805b00; }
  .badge.generated { background:#e6f7e6; color:#1a7a1a; }
</style>
</head>
<body>
<header>
  <h1>📋 RACU International — MTN Agent Onboarding Dashboard</h1>
</header>
<div class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
